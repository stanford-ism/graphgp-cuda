[project]
name = "graphgp-cuda"
version = "0.0.4"
description = "Custom CUDA extension for GraphGP package."
authors = [
    {name="Benjamin Dodge", email="bendodge@stanford.edu"},
    {name="Philipp Frank", email="phfrank@stanford.edu"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax"
]

[project.optional-dependencies]
dev = [
    "jax[cuda13]",
    "pytest>=8.3.5",
    "ruff>=0.11.11",
    # for rebuilding without build isolation, see the README
    "scikit-build-core",
    "cmake>=3.24",
    "ninja",
]

[project.urls]
Source = "https://github.com/stanford-ism/graphgp-cuda"

[build-system]
# The pip CUDA 13 toolkit is found by CMakeLists.txt, so building needs no system CUDA installation
requires = ["scikit-build-core", "jax", "nvidia-cuda-nvcc>=13,<14", "nvidia-cuda-runtime>=13,<14"]
build-backend = "scikit_build_core.build"

[tool.ruff]
line-length = 120
exclude = ["*.ipynb", "*.cu", "*.h"]